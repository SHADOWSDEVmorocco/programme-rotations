<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Programme des Rotations</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand"><span id="brandIcon"></span> Programme des Rotations</div>
      <nav class="toolbar" id="toolbar"></nav>
      <div class="user" id="userBox"></div>
    </header>
    <div class="weekbar" id="weekbar"></div>
    <div class="tabs" id="tabs"></div>
    <main class="main">
      <section class="sheet-edit">
        <div class="head" id="head"></div>
        <div class="table-wrap"><table class="grid" id="grid"></table></div>
      </section>
      <aside class="side">
        <h3>Contrôles</h3>
        <ul id="checks"></ul>
      </aside>
    </main>
    <footer class="status" id="status"></footer>
  </div>

  <div id="print"></div>
  <dialog id="dlg"></dialog>
  <div id="toast"></div>
  <noscript>Activez JavaScript pour utiliser l'application.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
